services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: minecraftshop
      POSTGRES_USER: minecraftshop
      POSTGRES_PASSWORD: ${DB_PASSWORD:-minecraftshop}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minecraftshop -d minecraftshop"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: [app] # nur mit `docker compose --profile app up`, beim IDE-Start läuft nur die DB
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/minecraftshop
      DB_USER: minecraftshop
      DB_PASSWORD: ${DB_PASSWORD:-minecraftshop}
    ports:
      - "8080:8080"

volumes:
  db-data:
